name: Build & Release Android APK

# Push a tag like "v1.2.3" to cut a real release, or run this manually
# (Actions tab -> this workflow -> Run workflow) for a one-off dev build.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Release builds always start clean.
          cache-read-only: true

      - name: Compute version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PcoresmsVersionCode="${{ steps.version.outputs.code }}" \
            -PcoresmsVersionName="${{ steps.version.outputs.name }}"

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Check the APK is signed with the release key
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK for release
        run: cp app/build/outputs/apk/release/app-release.apk "coresms-${{ steps.version.outputs.name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          files: coresms-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
